services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: fitsho
      POSTGRES_PASSWORD: fitsho
      POSTGRES_DB: fitsho
    ports:
      - "5432:5432"
    volumes:
      - fitsho_postgres_data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitsho -d fitsho"]
      interval: 5s
      timeout: 5s
      retries: 10

  agent-service:
    build:
      context: ./agent-service
    environment:
      AGENT_SERVICE_TOKEN: ${AGENT_SERVICE_TOKEN:-}
      HOME: /home/agent
      HTTP_PROXY: ${AGENT_HTTP_PROXY:-}
      HTTPS_PROXY: ${AGENT_HTTPS_PROXY:-}
      NO_PROXY: ${AGENT_NO_PROXY:-agent-service,db,localhost,127.0.0.1}
      AGENT_WORKSPACE_ROOT: /tmp/fitsho-agent
      AGENT_AUTH_SESSION_TTL_SECONDS: ${AGENT_AUTH_SESSION_TTL_SECONDS:-600}
      AGENT_AUTH_MAX_OUTPUT_BYTES: ${AGENT_AUTH_MAX_OUTPUT_BYTES:-65536}
      AGENT_ANTIGRAVITY_MODELS: ${AGENT_ANTIGRAVITY_MODELS:-[]}
      AGENT_ANTIGRAVITY_SUPPORTS_IMAGE_INPUT: ${AGENT_ANTIGRAVITY_SUPPORTS_IMAGE_INPUT:-false}
      AGENT_CODEX_MODELS: ${AGENT_CODEX_MODELS:-[]}
      AGENT_CODEX_SUPPORTS_IMAGE_INPUT: ${AGENT_CODEX_SUPPORTS_IMAGE_INPUT:-false}
      AGENT_CLAUDE_MODELS: ${AGENT_CLAUDE_MODELS:-[]}
      AGENT_CLAUDE_SUPPORTS_IMAGE_INPUT: ${AGENT_CLAUDE_SUPPORTS_IMAGE_INPUT:-false}
    expose:
      - "9001"
    volumes:
      - fitsho_agent_home:/home/agent
    cap_drop:
      - ALL
    read_only: true
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9001/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://fitsho:fitsho@db:5432/fitsho
      FRONTEND_ORIGIN: http://localhost:5173
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://10.120.36.22:5173,http://100.97.78.5:5173}
      APP_ENV: local
      COOKIE_SECURE: "false"
      SESSION_COOKIE_NAME: fitsho_session
      MEDIA_ROOT: /var/lib/fitsho/media
      MEDIA_PUBLIC_PATH: /media
      MEDIA_MAX_BYTES: "20971520"
      MEDIA_MAX_VIDEO_BYTES: "67108864"
      MEDIA_MAX_VIDEO_DURATION_SECONDS: "20"
      BODY_PHOTO_STORAGE_ROOT: /var/lib/fitsho/private/body-photos
      FOOD_PHOTO_STORAGE_ROOT: /var/lib/fitsho/private/food-photos
      NUTRITION_LAB_STORAGE_ROOT: /var/lib/fitsho/private/nutrition-labs
      AGENT_SERVICE_BASE_URL: http://agent-service:9001
      AGENT_SERVICE_TOKEN: ${AGENT_SERVICE_TOKEN:-}
      NO_PROXY: agent-service,db,localhost,127.0.0.1
    ports:
      - "8001:8000"
    volumes:
      - ./backend/var/media:/var/lib/fitsho/media
      - ./backend/var/private/body-photos:/var/lib/fitsho/private/body-photos
      - ./backend/var/private/food-photos:/var/lib/fitsho/private/food-photos
      - ./backend/var/private/nutrition-labs:/var/lib/fitsho/private/nutrition-labs
      - fitsho_exercise_media:/var/lib/fitsho/media-legacy:ro
      - ./backend/var/media-migration:/app/var/media-migration
      - ./backend/var/media-migration-source:/var/lib/fitsho/media-migration-source:ro
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000

volumes:
  fitsho_postgres_data:
  fitsho_exercise_media:
  fitsho_agent_home:
