[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fitsho-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1,<2",
  "cryptography>=43,<47",
  "email-validator>=2,<3",
  "fastapi>=0.115,<1",
  "httpx[socks]>=0.27,<1",
  "jsonschema>=4.23,<5",
  "pillow>=11,<13",
  "psycopg[binary]>=3,<4",
  "pwdlib[argon2]>=0.2,<1",
  "pydantic-settings>=2,<3",
  "python-multipart>=0.0.18,<1",
  "sqlalchemy>=2,<3",
  "uvicorn[standard]>=0.30,<1",
  "weasyprint>=69,<70",
]

[project.optional-dependencies]
dev = [

  "mypy>=1.13,<2",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
  "types-jsonschema>=4.23,<5",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
