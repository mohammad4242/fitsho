name: Fitician CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: fitician-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fitsho
          POSTGRES_PASSWORD: fitsho
          POSTGRES_DB: fitsho_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitsho -d fitsho_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen --extra dev
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Create dedicated benchmark databases
        run: |
          uv run python - <<'PY'
          import psycopg
          from psycopg import sql

          with psycopg.connect(
              "postgresql://fitsho:fitsho@localhost:5432/postgres",
              autocommit=True,
          ) as connection:
              for database_name in ("fitsho", "fitsho_nutrition_audit"):
                  exists = connection.execute(
                      "SELECT 1 FROM pg_database WHERE datname = %s",
                      (database_name,),
                  ).fetchone()
                  if exists is None:
                      connection.execute(
                          sql.SQL("CREATE DATABASE {}").format(
                              sql.Identifier(database_name)
                          )
                      )
          PY
      - name: Migrate benchmark databases
        run: |
          DATABASE_URL=postgresql+psycopg://fitsho:fitsho@localhost:5432/fitsho \
            uv run alembic upgrade head
          DATABASE_URL=postgresql+psycopg://fitsho:fitsho@localhost:5432/fitsho_nutrition_audit \
            uv run alembic upgrade head
      - name: Seed nutrition benchmark database
        run: |
          DATABASE_URL=postgresql+psycopg://fitsho:fitsho@localhost:5432/fitsho_nutrition_audit \
            uv run python -m scripts.seed_nutrition_benchmark
      - name: Seed workout benchmark database
        run: |
          DATABASE_URL=postgresql+psycopg://fitsho:fitsho@localhost:5432/fitsho \
            uv run python -m app.exercises.seed
          DATABASE_URL=postgresql+psycopg://fitsho:fitsho@localhost:5432/fitsho \
            uv run python -m scripts.seed_benchmark_catalog
          DATABASE_URL=postgresql+psycopg://fitsho:fitsho@localhost:5432/fitsho \
            uv run python -m app.training_templates.seed
      - run: uv run pytest
        env:
          DATABASE_URL: postgresql+psycopg://fitsho:fitsho@localhost:5432/fitsho
          TEST_DATABASE_URL: postgresql+psycopg://fitsho:fitsho@localhost:5432/fitsho_test
          NUTRITION_AUDIT_DATABASE_URL: postgresql+psycopg://fitsho:fitsho@localhost:5432/fitsho_nutrition_audit

  frontend:
    name: Frontend tests, lint, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
          cache: npm
      - run: npm ci
      - run: npm run build:core
      - run: npm run test --workspace frontend
      - run: npm run lint --workspace frontend
      - run: npm run build --workspace frontend

  frontend-browser:
    name: Frontend browser regression (Chromium and WebKit)
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e --workspace frontend

  shared:
    name: Shared core and contract checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          version: latest
      - run: npm ci
      - run: npm run test:core
      - run: npm run check:openapi
      - run: npm run test:contracts

  mobile:
    name: Mobile tests and validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
          cache: npm
      - run: npm ci
      - run: npm run build:core
      - run: npm run test --workspace @fitician/mobile
      - run: npm run test:native --workspace @fitician/mobile
      - run: npm run test:mobile:foundation
      - run: npm run typecheck:mobile
      - run: npm run validate:mobile

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm run prebuild --workspace @fitician/mobile -- --platform android --no-install
        env:
          CI: "1"
      - run: ./gradlew :app:assembleDebug
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: fitician-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
          cache: npm
      - run: npm ci
      - run: npm run audit:dependencies --workspace @fitician/mobile

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
      - run: npm run security:secrets
