name: Fitician iOS release

on:
  workflow_dispatch:
    inputs:
      profile:
        description: iOS release profile
        required: true
        type: choice
        default: preview
        options:
          - development
          - preview
          - production
          - sideload

permissions:
  contents: read

jobs:
  build:
    if: ${{ inputs.profile != 'sideload' }}
    name: Build ${{ inputs.profile }} iOS artifact
    runs-on: ubuntu-latest
    environment: ${{ inputs.profile }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
          cache: npm
      - run: npm ci
      - name: Build signed EAS artifact
        env:
          EAS_TOKEN: ${{ secrets.EAS_TOKEN }}
        run: |
          case "${{ inputs.profile }}" in
            development) npm run build:ios:debug --workspace @fitician/mobile ;;
            preview) npm run build:ios:internal --workspace @fitician/mobile ;;
            production) npm run build:ios:production --workspace @fitician/mobile ;;
            *) echo "Unsupported release profile" >&2; exit 2 ;;
          esac

  sideload:
    if: ${{ inputs.profile == 'sideload' }}
    name: Build unsigned iOS sideload IPA
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
          cache: npm
      - name: Select Swift 6.2 toolchain
        run: |
          set -euo pipefail
          xcode_app=""
          for candidate in \
            /Applications/Xcode_26.3.app \
            /Applications/Xcode_26.2.app \
            /Applications/Xcode_26.1.1.app \
            /Applications/Xcode_26.0.1.app; do
            if [[ -d "$candidate" ]]; then
              xcode_app="$candidate"
              break
            fi
          done
          if [[ -z "$xcode_app" ]]; then
            echo "No Xcode 26 toolchain is installed on macos-15" >&2
            ls -d /Applications/Xcode*.app >&2
            exit 1
          fi
          sudo xcode-select -s "$xcode_app"
          xcodebuild -version
          swift --version
      - run: npm ci
      - name: Patch Swift 6.2 sideload dependency compatibility
        run: node mobile/scripts/patch-ios-sideload-dependencies.mjs
        env:
          IOS_SIDELOAD_BUILD: "1"
      - run: npm run build:core
      - name: Generate sideload iOS project
        run: npm run prebuild --workspace @fitician/mobile -- --platform ios --clean --no-install
        env:
          CI: "1"
          APP_VARIANT: development
          IOS_SIDELOAD_BUILD: "1"
          EXPO_PUBLIC_API_BASE_URL: http://100.97.78.5:8001
          EXPO_PUBLIC_FRONTEND_ORIGIN: http://100.97.78.5:5173
      - name: Install CocoaPods dependencies
        working-directory: mobile/ios
        run: pod install
      - name: Build and verify unsigned device IPA
        run: ./mobile/scripts/build-ios-sideload.sh
        env:
          CI: "1"
          APP_VARIANT: development
          IOS_SIDELOAD_BUILD: "1"
          EXPO_PUBLIC_API_BASE_URL: http://100.97.78.5:8001
          EXPO_PUBLIC_FRONTEND_ORIGIN: http://100.97.78.5:5173
      - uses: actions/upload-artifact@v4
        with:
          name: fitician-ios-unsigned
          path: |
            dist/ios/Fitician-unsigned.ipa
            dist/ios/fitician-ios-build-info.txt
          if-no-files-found: error
          retention-days: 14
